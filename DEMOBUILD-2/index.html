<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopify Launch Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shopify Launch Checklist</h1>
    <p class="sub">12 steps before you go live</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="progress-text" id="progressText">0 / 12 complete</p>
  </header>
  <main id="checklist"></main>
  <footer>
    <button type="button" id="resetBtn">Reset</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
